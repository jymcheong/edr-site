<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&amp;family=IBM+Plex+Sans:wght@600;700&amp;display=swap');
      text { font-family: 'Comic Neue', 'IBM Plex Sans', -apple-system, sans-serif; }
      .bubble-text { font-size: 17px; font-weight: 700; fill: #14130f; }
      .panel-title { font-size: 19px; font-weight: 700; fill: #ffffff; letter-spacing: -0.5px; }
      .narration { font-size: 14px; fill: #e8a33d; font-weight: 700; }
    </style>
    <filter id="pop-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="1280" fill="#14130f"/>

  <!-- Comic Title Strip -->
  <g transform="translate(36, 40)">
    <text x="0" y="0" fill="#e8a33d" font-size="14" font-weight="700" letter-spacing="2">EDR.SG COMIC CHRONICLES</text>
    <text x="0" y="32" fill="#ffffff" font-size="28" font-weight="700">The VPN Illusion &amp; The Flat Network</text>
  </g>

  <!-- ==================== PANEL 1: THE SHINY FRONT DOOR ==================== -->
  <g transform="translate(36, 95)" filter="url(#pop-shadow)">
    <rect width="648" height="260" rx="14" fill="#1e1c18" stroke="#3d372e" stroke-width="2"/>
    <rect x="0" y="0" width="648" height="36" rx="14" fill="#2d2922"/>
    <rect x="0" y="20" width="648" height="16" fill="#2d2922"/>
    <text x="18" y="24" class="panel-title">1. The Proud Boss &amp; The Giant Door</text>

    <!-- Visual: Boss and Steel Door -->
    <g transform="translate(30, 56)">
      <!-- Giant Door -->
      <rect x="360" y="10" width="120" height="170" rx="6" fill="#4a5568" stroke="#cbd5e0" stroke-width="3"/>
      <rect x="380" y="30" width="80" height="60" rx="4" fill="#2d3748"/>
      <circle cx="465" cy="100" r="8" fill="#ecc94b"/>
      <text x="420" y="65" fill="#f7fafc" font-size="13" font-weight="700" text-anchor="middle">ENTERPRISE</text>
      <text x="420" y="80" fill="#ecc94b" font-size="14" font-weight="700" text-anchor="middle">VPN GATEWAY</text>

      <!-- Outside bots attacking -->
      <g transform="translate(500, 40)">
        <text x="0" y="20" fill="#e05244" font-size="24">👾</text>
        <text x="30" y="50" fill="#e05244" font-size="24">🤖</text>
        <text x="5" y="80" fill="#e05244" font-size="24">👾</text>
        <text x="60" y="35" fill="#e05244" font-size="12" font-weight="700">Exploit!</text>
        <text x="65" y="70" fill="#e05244" font-size="12" font-weight="700">Port 443!</text>
      </g>

      <!-- Boss Character -->
      <g transform="translate(180, 50)">
        <circle cx="40" cy="30" r="26" fill="#ecc94b"/>
        <!-- Face: Smug smile -->
        <circle cx="32" cy="24" r="3" fill="#1a202c"/>
        <circle cx="48" cy="24" r="3" fill="#1a202c"/>
        <path d="M 30 38 Q 40 48 50 38" stroke="#1a202c" stroke-width="3" fill="none"/>
        <!-- Tie & Suit -->
        <path d="M 20 60 L 60 60 L 65 110 L 15 110 Z" fill="#2b6cb0"/>
        <polygon points="36,60 44,60 46,95 40,105 34,95" fill="#e53e3e"/>
      </g>

      <!-- Speech Bubble -->
      <g transform="translate(0, 10)">
        <rect width="180" height="66" rx="12" fill="#ffffff"/>
        <polygon points="175,45 195,50 175,55" fill="#ffffff"/>
        <text x="14" y="28" class="bubble-text">"Our perimeter is 100%</text>
        <text x="14" y="50" class="bubble-text">impenetrable!" 👔</text>
      </g>
    </g>
  </g>

  <!-- ==================== PANEL 2: THE COFFEE SHOP ==================== -->
  <g transform="translate(36, 375)" filter="url(#pop-shadow)">
    <rect width="648" height="260" rx="14" fill="#1e1c18" stroke="#3d372e" stroke-width="2"/>
    <rect x="0" y="0" width="648" height="36" rx="14" fill="#2d2922"/>
    <rect x="0" y="20" width="648" height="16" fill="#2d2922"/>
    <text x="18" y="24" class="panel-title">2. Meanwhile, At The Coffee Shop...</text>

    <!-- Visual: Remote Dev drinking Boba & Hacker entering laptop -->
    <g transform="translate(30, 56)">
      <!-- Dev Character -->
      <g transform="translate(40, 50)">
        <circle cx="40" cy="30" r="26" fill="#f6ad55"/>
        <circle cx="32" cy="24" r="3" fill="#1a202c"/>
        <circle cx="48" cy="24" r="3" fill="#1a202c"/>
        <circle cx="40" cy="38" r="5" fill="#1a202c"/>
        <!-- Hoodie -->
        <path d="M 15 60 L 65 60 L 70 110 L 10 110 Z" fill="#4a5568"/>
        <!-- Boba Cup -->
        <rect x="75" y="65" width="22" height="35" rx="3" fill="#cbd5e0"/>
        <line x1="86" y1="50" x2="86" y2="70" stroke="#805ad5" stroke-width="4"/>
      </g>

      <!-- Speech Bubble Dev -->
      <g transform="translate(140, 15)">
        <rect width="180" height="66" rx="12" fill="#ffffff"/>
        <polygon points="145,55 130,65 148,68" fill="#ffffff"/>
        <text x="14" y="28" class="bubble-text">"Yay! Free café Wi-Fi</text>
        <text x="14" y="50" class="bubble-text">and bubble tea!" 🧋</text>
      </g>

      <!-- Laptop with sneaky Hacker -->
      <g transform="translate(360, 40)">
        <!-- Laptop -->
        <rect x="20" y="40" width="100" height="65" rx="4" fill="#718096" stroke="#e2e8f0" stroke-width="2"/>
        <polygon points="0,110 140,110 130,105 10,105" fill="#cbd5e0"/>
        <rect x="30" y="48" width="80" height="48" fill="#1a202c"/>
        <text x="70" y="78" fill="#48bb78" font-size="13" font-weight="700" text-anchor="middle">VPN CONNECT</text>
        
        <!-- Sneaky Raccoon / Hacker creeping in -->
        <g transform="translate(130, 10)">
          <circle cx="40" cy="35" r="24" fill="#2d3748"/>
          <!-- Mask -->
          <rect x="20" y="26" width="40" height="16" rx="6" fill="#1a202c"/>
          <circle cx="30" cy="34" r="3" fill="#e53e3e"/>
          <circle cx="50" cy="34" r="3" fill="#e53e3e"/>
          <text x="40" y="80" fill="#e53e3e" font-size="28" text-anchor="middle">🦝</text>
          
          <!-- Hacker Bubble -->
          <rect x="70" y="0" width="110" height="45" rx="8" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.5"/>
          <text x="78" y="26" fill="#9b2c2c" font-size="13" font-weight="700">"I'm in! 😈"</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== PANEL 3: THE FLAT DISASTER ==================== -->
  <g transform="translate(36, 655)" filter="url(#pop-shadow)">
    <rect width="648" height="260" rx="14" fill="#261210" stroke="#742a2a" stroke-width="2"/>
    <rect x="0" y="0" width="648" height="36" rx="14" fill="#4a1d18"/>
    <rect x="0" y="20" width="648" height="16" fill="#4a1d18"/>
    <text x="18" y="24" class="panel-title">3. The Disaster: Inside The Flat Network</text>

    <!-- Visual: Open Gate & Hacker looting with cart -->
    <g transform="translate(30, 52)">
      <!-- Open Gate -->
      <g transform="translate(10, 10)">
        <rect x="0" y="20" width="20" height="140" fill="#4a5568"/>
        <line x1="20" y1="30" x2="70" y2="10" stroke="#cbd5e0" stroke-width="4"/>
        <text x="10" y="10" fill="#e53e3e" font-size="12" font-weight="700">VPN OPEN!</text>
      </g>

      <!-- Hacker with shopping cart -->
      <g transform="translate(120, 20)">
        <text x="30" y="50" font-size="44">🦝🛒</text>
        <!-- Shopping cart contents -->
        <rect x="85" y="10" width="70" height="40" rx="4" fill="#ecc94b" stroke="#b7791f"/>
        <text x="120" y="30" fill="#744210" font-size="11" font-weight="700" text-anchor="middle">DATABASE</text>
        <text x="120" y="44" fill="#744210" font-size="9" text-anchor="middle">Customer Data</text>

        <!-- Bubble -->
        <g transform="translate(10, 65)">
          <rect width="210" height="66" rx="12" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/>
          <text x="12" y="26" fill="#9b2c2c" class="bubble-text">"Wait... there are NO</text>
          <text x="12" y="48" fill="#9b2c2c" class="bubble-text">internal doors?! Free loot!"</text>
        </g>
      </g>

      <!-- Looted Corporate assets -->
      <g transform="translate(390, 20)">
        <rect x="0" y="0" width="210" height="150" rx="8" fill="#321614" stroke="#e53e3e" stroke-dasharray="6,4"/>
        <text x="105" y="28" fill="#ff7a66" font-size="14" font-weight="700" text-anchor="middle">🚨 WIDE OPEN RUNWAY</text>
        <text x="20" y="60" fill="#fbd38d" font-size="13">📂 CEO Emails: Breached</text>
        <text x="20" y="90" fill="#fbd38d" font-size="13">💳 Finance DB: Downloaded</text>
        <text x="20" y="120" fill="#fbd38d" font-size="13">💻 Peer Laptops: Infected</text>
      </g>
    </g>
  </g>

  <!-- ==================== PANEL 4: THE CYBERSNIPER FIX ==================== -->
  <g transform="translate(36, 935)" filter="url(#pop-shadow)">
    <rect width="648" height="300" rx="14" fill="#151c14" stroke="#2f6634" stroke-width="2"/>
    <rect x="0" y="0" width="648" height="36" rx="14" fill="#1e3a22"/>
    <rect x="0" y="20" width="648" height="16" fill="#1e3a22"/>
    <text x="18" y="24" class="panel-title">4. The CyberSniper Fix: Inevitable Path Tripwire</text>

    <!-- Visual: Micro-isolation and sniper trap -->
    <g transform="translate(30, 48)">
      <!-- Worker in isolated bubble -->
      <g transform="translate(20, 20)">
        <circle cx="50" cy="50" r="46" fill="#1a2f1c" stroke="#48bb78" stroke-width="2"/>
        <text x="50" y="44" font-size="28" text-anchor="middle">💻</text>
        <text x="50" y="70" fill="#68d391" font-size="11" font-weight="700" text-anchor="middle">App Only</text>
        <text x="50" y="84" fill="#a0aec0" font-size="9" text-anchor="middle">(No DB Route)</text>
      </g>

      <!-- Hacker stepping out and getting CAUGHT -->
      <g transform="translate(150, 15)">
        <!-- Laser Tripwire Line -->
        <line x1="40" y1="0" x2="40" y2="170" stroke="#f56565" stroke-width="3" stroke-dasharray="6,4"/>
        <text x="45" y="20" fill="#f56565" font-size="11" font-weight="700">TRIPWIRE</text>

        <!-- Cage Dropped on Hacker -->
        <g transform="translate(60, 25)">
          <rect x="0" y="0" width="100" height="100" rx="8" fill="#2d3748" stroke="#ecc94b" stroke-width="3"/>
          <!-- Cage Bars -->
          <line x1="25" y1="0" x2="25" y2="100" stroke="#ecc94b" stroke-width="3"/>
          <line x1="50" y1="0" x2="50" y2="100" stroke="#ecc94b" stroke-width="3"/>
          <line x1="75" y1="0" x2="75" y2="100" stroke="#ecc94b" stroke-width="3"/>
          <text x="50" y="65" font-size="34" text-anchor="middle">🦝💥</text>
          <text x="50" y="90" fill="#fc8181" font-size="12" font-weight="700" text-anchor="middle">TRAPPED!</text>
        </g>
      </g>

      <!-- Robot Sniper Guard -->
      <g transform="translate(370, 30)">
        <text x="40" y="50" font-size="44">🤖🎯</text>
        <g transform="translate(90, 0)">
          <rect width="180" height="85" rx="10" fill="#ffffff"/>
          <polygon points="0,35 -15,42 0,50" fill="#ffffff"/>
          <text x="14" y="26" class="bubble-text">"必经之路 triggered!</text>
          <text x="14" y="48" class="bubble-text">You had to scan,</text>
          <text x="14" y="70" class="bubble-text">so you got caught!" 🚨</text>
        </g>
      </g>

      <!-- Bottom takeaway line -->
      <g transform="translate(10, 195)">
        <rect width="600" height="42" rx="6" fill="#1b281d" stroke="#38a169"/>
        <text x="300" y="26" fill="#9ae6b4" font-size="14" font-weight="700" text-anchor="middle">✨ Services cloaked · Laptops isolated · Lateral moves caught cold on step 1</text>
      </g>
    </g>
  </g>
</svg>
